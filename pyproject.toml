[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-surgery"
version = "1.0.0"
description = "Reproduce direct weight-editing experiments on a pretrained LunarLander policy"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.0,<3", "pillow>=11,<13", "gymnasium[box2d]==1.4.0"]

[project.optional-dependencies]
inference = ["prime==0.19.0"]
weights = ["torch==2.15.0", "huggingface-hub>=1,<2"]
figures = ["matplotlib>=3.10,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
policy-surgery = "policy_surgery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["policy_surgery"]

[tool.hatch.build.targets.sdist]
include = ["/policy_surgery", "/tests", "/README.md", "/LICENSE", "/NOTICE.md", "/CITATION.cff", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
